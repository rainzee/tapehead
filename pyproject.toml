[project]
name = "tapehead"
version = "0.0.1"
description = "Agent harness built on an append-only tape"
readme = "README.md"
authors = [
    { name = "rainzee wang", email = "rainzee.w@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "msgspec>=0.21.1",
]

[project.urls]
Repository = "https://github.com/rainzee/tapehead"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 128
target-version = "py313"
