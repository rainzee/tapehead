<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 198.7 149.0"><style>:root{--mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;--line:#8e9397;--detail:#c3c6c8;--body:#ececeb;--deck:#f3f3f2;--recess:#e2e4e4;--ink:#6a6f73;--glass-on:#f3e6da;--accent:#f06a00;--accent-hi:#ff8c2e;--accent-dim:rgba(240,106,0,.08)}@media (prefers-color-scheme:dark){:root{--line:#3d4144;--detail:#2b2e30;--body:#17181a;--deck:#1b1d1f;--recess:#0e0f10;--ink:#868b8f;--glass-on:#1a1410;--accent:#ff7a1a;--accent-hi:#ffb070;--accent-dim:rgba(255,122,26,.10)}}text{font-family:var(--mono)}.face{fill:var(--body);stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}.face.top{fill:var(--deck)}.face.recess{fill:var(--recess)}.detail{fill:none;stroke:var(--detail);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round}.label{fill:var(--ink)}.wire{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:3 3}.led{fill:var(--detail)}.led.hot,.spark{fill:var(--accent)}.halo{fill:var(--accent);opacity:.22}.face.hot{fill:var(--accent);stroke:var(--accent-hi)}.face.top.hot{fill:var(--accent-hi)}.face.glass{fill:var(--glass-on);stroke:var(--accent)}.zone{fill:var(--accent-dim);stroke:var(--accent);stroke-width:1;vector-effect:non-scaling-stroke}.wire.hot,.detail.hot{stroke:var(--accent)}.label.hot{fill:var(--accent)}.pulse{fill:none;stroke:var(--accent-hi);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:70 1200;stroke-dashoffset:70;opacity:0;animation:pulse 2.4s linear infinite}@keyframes pulse{0%{stroke-dashoffset:70;opacity:1}60%{stroke-dashoffset:-1000;opacity:1}61%,100%{opacity:0}}.spin{animation:spin 6s linear infinite}.spin.rev{animation-direction:reverse}@keyframes spin{to{transform:rotate(360deg)}}.blink{animation:blink 1.2s steps(1) infinite}@keyframes blink{50%{opacity:.12}}.breathe{animation:breathe 2.4s ease-in-out infinite}@keyframes breathe{50%{opacity:.3}}.halo.breathe{animation-name:halo}@keyframes halo{50%{opacity:.05}}.seq{animation:seq 2.4s steps(1) infinite;opacity:.15}@keyframes seq{0%,30%{opacity:1}}.flow{animation:flow .6s linear infinite}@keyframes flow{to{stroke-dashoffset:-6}}.run{animation:run 1.2s linear infinite}@keyframes run{to{transform:translate(var(--dx),var(--dy))}}.spark{animation:spark 1.6s ease-out infinite;opacity:0}@keyframes spark{0%{opacity:0}15%{opacity:1}60%,100%{opacity:0}}.drop{animation:drop 3.2s cubic-bezier(.5,0,.3,1) infinite}@keyframes drop{0%{transform:translate(var(--dx),var(--dy));opacity:0}12%{opacity:1}40%{transform:none}46%{transform:translateY(1.5px)}52%,82%{transform:none;opacity:1}100%{opacity:0}}.rise{animation:rise 3.6s ease-out infinite;opacity:0}@keyframes rise{0%{opacity:0;transform:translateY(10px)}18%,80%{opacity:1;transform:none}100%{opacity:0}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translate(var(--dx),var(--dy))}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rise,.spark,.seq{opacity:1}}.still *{animation:none!important}.still .rise,.still .spark,.still .seq{opacity:1}</style><defs><filter id="glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="bloom" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="9"/></filter></defs><g transform="translate(71.64 38.31)"><path class="face" d="M-49.22 26.00L-49.20 25.86L-49.17 25.72L-49.11 25.59L-49.03 25.46L-48.93 25.33L-48.80 25.21L-48.66 25.10L-48.50 25.00L-17.32 7.00L-17.